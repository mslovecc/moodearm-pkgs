name: Build and Release moOde ARM64 Deb Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'latest'

permissions:
  contents: write

env:
  TERM: xterm

jobs:
  build:
    name: Build ${{ matrix.package }} (Debian Trixie ARM64)
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:trixie-slim
      options: --platform linux/arm64
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: nqptp
          - package: shairport-sync
          - package: librespot

    steps:
      # ============================================================
      # 1. 基础工具 + 真 sudo + equivs（mk-build-deps 需要）
      # ============================================================
      - name: Bootstrap base tools
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            sudo equivs \
            git ca-certificates curl wget \
            build-essential fakeroot debhelper dh-make devscripts \
            pkg-config file dpkg-dev gcc g++ make \
            libtool libtool-bin autoconf automake \
            swig pv python3-pip \
            libplist-utils xxd

          # 验证 sudo 可用
          sudo -E true
          echo "sudo OK"

      # ============================================================
      # 2. 克隆 mslovecc/pkgbuild
      # ============================================================
      - name: Clone mslovecc/pkgbuild
        run: |
          git clone --depth 1 https://github.com/mslovecc/pkgbuild.git pkgbuild
          ls -la pkgbuild/packages/
          ls -la pkgbuild/scripts/

      # ============================================================
      # 3. 各包依赖 —— 一次性装齐，避免构建中途 apt
      # ============================================================
      - name: Install nqptp dependencies
        if: matrix.package == 'nqptp'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y --no-install-recommends \
            autoconf automake libtool libtool-bin

      - name: Install shairport-sync dependencies
        if: matrix.package == 'shairport-sync'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y --no-install-recommends \
            autoconf automake libtool libtool-bin xxd swig pv \
            libdaemon-dev libasound2-dev libpopt-dev libconfig-dev \
            libssl-dev libavahi-client-dev libsoxr-dev \
            libplist-dev libplist-utils \
            libsodium-dev libavutil-dev libavcodec-dev libavformat-dev \
            uuid-dev libgcrypt-dev libmosquitto-dev \
            libjack-jackd2-dev libpipewire-0.3-dev libpulse-dev \
            libsndfile1-dev xmltoman \
            libglib2.0-dev libconfig++-dev \
            libsystemd-dev

      - name: Install librespot dependencies
        if: matrix.package == 'librespot'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libpulse-dev \
            libavahi-client-dev libssl-dev
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --profile minimal --default-toolchain stable
          . "$HOME/.cargo/env"
          cargo install cargo-deb --locked

      # ============================================================
      # 4. 准备 pkgbuild 环境
      # ============================================================
      - name: Prepare pkgbuild environment
        run: |
          set -eux
          cd pkgbuild

          if [ -f scripts/setenv.sh.example ] && [ ! -f scripts/setenv.sh ]; then
            cp scripts/setenv.sh.example scripts/setenv.sh
          fi
          if [ -f setenv.sh.example ] && [ ! -f setenv.sh ]; then
            cp setenv.sh.example setenv.sh
          fi

          echo "===== scripts/setenv.sh ====="
          [ -f scripts/setenv.sh ] && cat scripts/setenv.sh || echo "(不存在)"

          chmod +x scripts/*.sh 2>/dev/null || true
          chmod +x packages/${{ matrix.package }}/build.sh
          ls -la packages/${{ matrix.package }}/

      # ============================================================
      # 5. 构建
      # ============================================================
      - name: Build ${{ matrix.package }}
        run: |
          set -eux
          cd pkgbuild
          [ -f scripts/setenv.sh ] && . scripts/setenv.sh || true
          [ -f setenv.sh ] && . setenv.sh || true
          export PATH="$PWD/scripts:$PATH"
          cd packages/${{ matrix.package }}
          ./build.sh

      # ============================================================
      # 6. 收集产物
      # ============================================================
      - name: Collect deb artifacts
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          find "$GITHUB_WORKSPACE/pkgbuild" -type f -name "*.deb" -exec ls -lh {} \;
          find "$GITHUB_WORKSPACE/pkgbuild" -type f -name "*.deb" \
            -exec cp -v {} "$GITHUB_WORKSPACE/artifacts/" \;
          ls -lh "$GITHUB_WORKSPACE/artifacts/"
          if [ -z "$(ls -A "$GITHUB_WORKSPACE/artifacts")" ]; then
            echo "ERROR: 未找到任何 .deb 产物" >&2
            exit 1
          fi

      - name: Verify architecture
        run: |
          set -eux
          for deb in "$GITHUB_WORKSPACE/artifacts/"*.deb; do
            echo "=== $deb ==="
            dpkg-deb --info "$deb" | grep -E 'Package|Version|Architecture'
          done

      - name: Upload ${{ matrix.package }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-deb
          path: artifacts/*.deb
          if-no-files-found: error
          retention-days: 7

  # ============================================================
  # Release
  # ============================================================
  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-debs

      - name: List all deb files
        run: find all-debs -type f -name '*.deb' -exec ls -lh {} \;

      - name: Determine tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.tag || 'latest' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "moOde ARM64 Packages ${{ steps.tag.outputs.tag }}"
          generate_release_notes: true
          files: all-debs/**/*.deb
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
