name: Build and Release moOde ARM64 Deb Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'latest'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.package }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: nqptp
          - package: shairport-sync
          - package: librespot

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 克隆 moOde 官方 pkgbuild 仓库 ----------
      - name: Clone mslovecc/pkgbuild
        run: git clone --depth 1 https://github.com/mslovecc/pkgbuild.git pkgbuild

      # ---------- 通用构建工具 ----------
      - name: Install base build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential fakeroot debhelper dh-make devscripts \
            pkg-config git wget curl ca-certificates file

      # ---------- 各包依赖 ----------
      - name: Install nqptp dependencies
        if: matrix.package == 'nqptp'
        run: |
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool

      - name: Install shairport-sync dependencies
        if: matrix.package == 'shairport-sync'
        run: |
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool xxd \
            libdaemon-dev libasound2-dev libpopt-dev libconfig-dev \
            libssl-dev libavahi-client-dev libsoxr-dev libplist-dev \
            libsodium-dev libavutil-dev libavcodec-dev libavformat-dev \
            uuid-dev libgcrypt-dev libmosquitto-dev

      - name: Install librespot dependencies
        if: matrix.package == 'librespot'
        run: |
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libpulse-dev \
            libavahi-client-dev libssl-dev
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --profile minimal --default-toolchain stable
          source "$HOME/.cargo/env"
          cargo install cargo-deb --locked

      # ---------- 准备 pkgbuild 环境 ----------
      - name: Prepare pkgbuild environment
        run: |
          set -eux
          cd pkgbuild

          echo "===== scripts/ 目录 ====="
          ls -la scripts/

          # 生成 setenv.sh（若不存在）
          if [ -f scripts/setenv.sh.example ] && [ ! -f scripts/setenv.sh ]; then
            cp scripts/setenv.sh.example scripts/setenv.sh
          fi
          # 若仓库根目录也有 setenv.sh.example，一并处理
          if [ -f setenv.sh.example ] && [ ! -f setenv.sh ]; then
            cp setenv.sh.example setenv.sh
          fi

          # 打印 setenv.sh 内容，方便排查
          echo "===== setenv.sh 内容 ====="
          [ -f scripts/setenv.sh ] && cat scripts/setenv.sh || true
          [ -f setenv.sh ] && cat setenv.sh || true

          chmod +x scripts/*.sh 2>/dev/null || true
          chmod +x packages/${{ matrix.package }}/build.sh
          ls -la packages/${{ matrix.package }}/

      # ---------- 构建 ----------
      - name: Build ${{ matrix.package }}
        run: |
          set -eux
          cd pkgbuild

          # source 公共函数库与环境变量
          [ -f scripts/setenv.sh ] && source scripts/setenv.sh || true
          [ -f setenv.sh ] && source setenv.sh || true

          # 让 build.sh 能找到 scripts/ 下的辅助脚本
          export PATH="$PWD/scripts:$PATH"

          cd packages/${{ matrix.package }}
          ./build.sh

      # ---------- 收集 deb 产物 ----------
      - name: Collect deb artifacts
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          echo "===== 搜索所有 .deb 文件 ====="
          find "$GITHUB_WORKSPACE/pkgbuild" -type f -name "*.deb" -exec ls -lh {} \;

          # 复制所有 deb 到 artifacts/
          find "$GITHUB_WORKSPACE/pkgbuild" -type f -name "*.deb" \
            -exec cp -v {} "$GITHUB_WORKSPACE/artifacts/" \;

          echo "===== artifacts/ 内容 ====="
          ls -lh "$GITHUB_WORKSPACE/artifacts/"

          if [ -z "$(ls -A "$GITHUB_WORKSPACE/artifacts")" ]; then
            echo "ERROR: 未找到任何 .deb 产物" >&2
            exit 1
          fi

      - name: Verify architecture
        run: |
          set -eux
          for deb in "$GITHUB_WORKSPACE/artifacts/"*.deb; do
            echo "=== $deb ==="
            dpkg-deb --info "$deb" | grep -E 'Package|Version|Architecture'
          done

      - name: Upload ${{ matrix.package }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-deb
          path: artifacts/*.deb
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-debs

      - name: List all deb files
        run: find all-debs -type f -name '*.deb' -exec ls -lh {} \;

      - name: Determine tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.tag || 'latest' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "moOde ARM64 Packages ${{ steps.tag.outputs.tag }}"
          generate_release_notes: true
          files: all-debs/**/*.deb
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
